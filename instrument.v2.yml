name: jafax
id: jafax
version: 1.0.0

actions:
  start:
    commands:
      mine-maven:
        id: mine-maven
        dir: ${instrumentPath}
        command: >-
          java -jar jafax.jar "${repo}" -OL

  summary:
    summaryMdFile: results/summary.md
    summaryHtmlFile: results/summary.html
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 jafax-summary.py "${instrumentPath}/results"
          unix: python3 jafax-summary.py "${instrumentPath}/results"

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
