name: Trivy Daily Scan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Inlined (see trivy-security-scan.yml) to prime the Maven cache and avoid the
# Maven Central 429 that breaks Trivy's pom resolution. Report-only daily drift
# scan; results go to the Security tab. No image scan (jafax ships no image).
jobs:
  trivy-fs-scan:
    name: Daily Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prime local Maven repository
        run: mvn -B -q dependency:go-offline

      - name: Run Trivy filesystem scan (sarif)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0
          severity: MEDIUM,HIGH,CRITICAL
          skip-dirs: 'node_modules,dist,target'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-daily
